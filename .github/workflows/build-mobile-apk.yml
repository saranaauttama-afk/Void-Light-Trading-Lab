name: Build Mobile APK

# Runs on GitHub's own runners, which have full internet access (Android
# SDK, Gradle, Maven) unlike a locked-down sandbox. Triggers whenever
# mobile/ changes, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # needed to publish the GitHub Release the APK is attached to

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest GitHub runners ship the Android SDK/build-tools
      # pre-installed with licenses already accepted — android-actions/
      # setup-android was flaky and is unnecessary here.

      # Turns the Expo-managed project into a real android/ Gradle project.
      # --no-install: we already installed JS deps above.
      - name: Expo prebuild (generate native Android project)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # Release variant: always embeds the JS bundle and has no dev-server
      # support code, so it runs standalone. Expo's generated build.gradle
      # signs release with the debug keystore by default — fine for
      # personal sideloading, no keystore setup needed. (A debug variant,
      # even with the bundle embedded, still waits on a Metro dev server
      # and shows a blank white screen.) arm64-only keeps the APK small.
      - name: Build release APK (debug-keystore signed)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Stage APK
        run: |
          mkdir -p release-out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             release-out/void-light-mobile-${{ github.run_number }}.apk

      # Publishing as a Release asset (rather than a workflow artifact) is
      # what makes it downloadable via a plain GitHub API request later.
      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: 'Void Light Mobile — build #${{ github.run_number }}'
          body: |
            Auto-built release APK (debug-keystore signed) from commit ${{ github.sha }}.
            Signed with the debug keystore — for personal sideloading, not Play Store distribution.
          files: release-out/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
